name: Refresh Keyword Research Dashboard

# Weekly, Monday morning IST (02:30 UTC = 08:00 IST), plus an on-demand
# button in the GitHub Actions tab (workflow_dispatch) so it can be run
# without opening an editor. This is a standalone repo -- not merged into
# any shared dashboard's refresh pipeline.
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-live.txt

      - name: Materialize GSC/GA4/Ads credential files from secrets
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python scripts/write_credentials.py

      - name: Build dashboard with fresh data
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
        run: python build_keyword_research_dashboard.py --phase live

      - name: Verify build
        run: python scripts/verify_build.py

      - name: Commit refreshed data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/keyword_research_data.json data/keyword_history.json index.html
          git diff --cached --quiet || git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
